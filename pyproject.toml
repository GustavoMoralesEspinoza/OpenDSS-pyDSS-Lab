[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendss-pydss-lab"
version = "1.0.0"
description = "Advanced Educational Laboratory for Distribution System Analysis using OpenDSS and py-dss-interface"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OpenDSS-pyDSS-Lab Contributors" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "py-dss-interface>=2.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "openpyxl>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]
